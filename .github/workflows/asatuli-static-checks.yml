name: Asatuli static checks

on:
  push:
    branches:
      - fix/driver-portal-database-linkage
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate scripts and invoice access rules
        run: node scripts/check-asatuli.mjs
